services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dishaa
      POSTGRES_PASSWORD: dishaa_dev_password
      POSTGRES_DB: dishaa
    ports:
      - "5432:5432"
    volumes:
      - dishaa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dishaa -d dishaa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dishaa_pgdata:
