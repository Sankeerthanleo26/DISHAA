# Curated list of official pages for the USA, student pathway through to green card (v0.1).
# Same rules as the Ireland list: official domains only, fetched politely (robots.txt, rate limit),
# stored raw before any cleaning. HTML pages only; PDFs are deferred until the extractor supports them.
# tier = "core": the page states the rule. tier = "supporting": regulation or policy text, overviews, news.
# visa_category names the pathway step: f1-student, f1-employment, practical-training, opt, stem-opt,
# h1b, o1, green-card, pathway-overview.
# Human-readable metadata (owner, page age, notes, candidates left out) lives in docs/SOURCE_REGISTRY.md.

[defaults]
country = "US"
visa_category = "f1-student"
tier = "core"

